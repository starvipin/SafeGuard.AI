# Configure project metadata, dependencies, pytest, and uv package sources.
# Project name, version, README, and required Python version.
[project]
name = "SafeGuard.AI"
version = "0.1.0"
description = "AI-assisted fraud-message detection with an explainable Flask interface"
readme = "README.md"
requires-python = ">=3.12" 

# uv sync installs these declared packages using the versions resolved in the lockfile.
dependencies = [
    # Flask provides the website/API framework; other packages support data, models, and tests.
    "flask>=3.1.3",
    # Declared dependency for serialized Python objects; DistilBERT currently saves with save_pretrained.
    "joblib>=1.5.3",
    # Numerical arrays and pandas tables/CSV processing.
    "numpy>=2.4.3",
    "pandas>=3.0.2",
    # Environment-file loading and YAML configuration parsing.
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    # Declared HTTP client; the current HF operations use huggingface_hub.
    "requests>=2.33.1",
    # Train/test splitting and accuracy, F1, and ROC AUC metrics.
    "scikit-learn>=1.8.0",
    # XGBoost is also declared, although the current numbered training pipeline uses DistilBERT.
    "xgboost>=3.2.0",
    # Pin PyTorch and matching vision/audio packages to their CUDA 12.1 builds.
    "torch==2.4.1+cu121",
    "torchvision==0.19.1+cu121",
    "torchaudio==2.4.1+cu121",
    # Pretrained DistilBERT classes and tokenization support.
    "transformers>=5.7.0",
    "tokenizers>=0.22.2",
    # Automated tests and mocking helpers, currently declared as project dependencies.
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    # Additional tokenization packages.
    "sentencepiece>=0.2.1",
    "tiktoken>=0.12.0",
    # HF model repository creation, upload, and download APIs.
    "huggingface-hub>=1.13.0",
    # Existing extra dotenv declaration; python-dotenv provides the .env loading import.
    "dotenv>=0.9.9",
    # Notebook interface dependency; starting the website does not run notebooks.
    "jupyter>=1.1.1",
]

# Discover test_* files in tests/ and include the project root on the import path.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Show verbose test names and short tracebacks, enforce strict markers, and control warning output.
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]

# Use a dedicated package index for CUDA-enabled PyTorch wheels.
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
# Resolve only explicitly mapped packages from this index, rather than all dependencies.
explicit = true

# Bind the torch package family to the pytorch-cu121 index above.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
