# GitHub Actions CI checks syntax and tests; this workflow does not deploy the live website.
name: Continuous Integration

# Run on matching push/PR events or through the manual Run workflow action.
on:
  # Enable manual workflow runs from GitHub Actions.
  workflow_dispatch:
  # Automatically run CI only for pushes to main or develop.
  push:
    branches: [main, develop]
  # Run for opened, updated, or reopened PRs whose target branch is main or develop.
  pull_request:
    branches: [main, develop]

# Grant read access to the repository; this workflow does not need permission to push code.
permissions:
  contents: read

# Cancel an older in-progress run when a newer run uses the same workflow and ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Execute this job's steps sequentially on the same Ubuntu runner.
  test:
    runs-on: ubuntu-latest
    # Stop the job if it runs longer than 20 minutes.
    timeout-minutes: 20

    steps:
      # Check out repository files into the runner's workspace.
      - name: Check out repository
        uses: actions/checkout@v4

      # Select Python 3.12 for the project.
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Install uv to manage dependencies and the Python environment.
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # Install versions from uv.lock; --frozen does not update the lockfile.
      - name: Install locked dependencies
        run: uv sync --frozen

      # Compile Python files to catch syntax errors without executing training or upload functions.
      - name: Check Python syntax
        run: uv run python -m compileall -q app.py src tests

      # Run the pytest suite; a failing test causes CI to fail.
      - name: Run test suite
        run: uv run pytest -q
