# Sync website code to the HF Docker Space; trained-model publishing is a separate Step 04 operation.
name: Sync to Hugging Face Docker Space

# Run on a main-branch push or manual dispatch; this workflow does not wait for CI success.
on:
  workflow_dispatch:
  push:
    branches:
      - main  

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository with its full Git history and LFS files.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A depth of zero fetches the full history instead of a shallow checkout.
          fetch-depth: 0
          lfs: true # large file

      # Push code and the Dockerfile to the HF Space; Hugging Face then builds the container.
      - name: Push Code and Dockerfile to Hugging Face
        # Read HF_TOKEN from the GitHub repository secret instead of hard-coding the token in YAML.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Run shell commands in order: configure Git identity, add the HF remote, then force-push.
        # NOTE: The existing --force command can replace HF main with the current checkout; this writes to the remote.
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Check the Hugging Face username and Space name in the destination below.
          git remote add hf https://sainivipin:$HF_TOKEN@huggingface.co/spaces/sainivipin/SafeGuard-Live
          
          # Push the checked-out code to the Hugging Face Space.
          git push --force hf HEAD:main
