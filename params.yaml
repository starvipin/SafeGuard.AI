# Model pipeline settings; resolve relative paths by running commands from the project root.
# Configure the source and prepared-data output for Step 01.
data_source:
  # Original dataset with text and label columns: 0=legitimate, 1=fraud.
  local_path: data/raw_data/fraud_dataset.csv
  # Directory containing the prepared dataset.
  raw_data_dir: data/raw_data
  # Step 01 output filename, read by Steps 02 and 03.
  dataset_name: dataset.csv

# Training hyperparameters and the model output location.
train:
  # Pretrained Hugging Face base model and tokenizer to fine-tune.
  model_name: distilbert-base-uncased
  # Save final weights, configuration, and tokenizer here; another training run can update this directory.
  model_output_dir: models/fraud_model_final
  # Process four examples per training/evaluation batch; this affects memory usage.
  batch_size: 4
  # Make three passes through the training split.
  epochs: 3
  # 5e-5 equals 0.00005, the optimizer's step size; training converts it to a float.
  learning_rate: 5e-5
  # Save a temporary checkpoint every 500 training batches; zero disables intermediate checkpoints.
  save_steps: 500
