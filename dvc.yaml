stages:
  data_ingestion:
    cmd: python -m src.model_training.step_01_prepare_data
    deps:
      - src/model_training/pipeline_helpers.py
      - src/model_training/step_01_prepare_data.py
      - params.yaml
      - data/raw_data/fraud_dataset.csv
    outs:
      - data/raw_data/dataset.csv

  training:
    cmd: python -m src.model_training.step_02_train_model
    deps:
      - src/model_training/pipeline_helpers.py
      - src/model_training/step_02_train_model.py
      - data/raw_data/dataset.csv
    params:
      - train.learning_rate
      - train.model_name
      - train.model_output_dir
      - train.batch_size
      - train.epochs
      - train.save_steps
    outs:
      - models/fraud_model_final

  evaluation:
    cmd: python -m src.model_training.step_03_evaluate_model
    deps:
      - src/model_training/pipeline_helpers.py
      - src/model_training/step_03_evaluate_model.py
      - models/fraud_model_final
      - data/raw_data/dataset.csv
    metrics:
      - metrics.json:
          cache: false
