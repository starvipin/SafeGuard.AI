# Dependencies define the pipeline order: prepare data, train, then evaluate. HF upload is not included.
stages:
  # Step 01 produces the prepared dataset from the source CSV.
  data_ingestion:
    cmd: python -m src.model_training.step_01_prepare_data
    # Changes to these source, configuration, or data files can make this stage out of date.
    deps:
      - src/model_training/pipeline_helpers.py
      - src/model_training/step_01_prepare_data.py
      - params.yaml
      - data/raw_data/fraud_dataset.csv
    # Track the prepared dataset as this stage's output and the next stage's input.
    outs:
      - data/raw_data/dataset.csv

  # Step 02 trains on the prepared CSV and saves models/fraud_model_final.
  training:
    cmd: python -m src.model_training.step_02_train_model
    deps:
      - src/model_training/pipeline_helpers.py
      - src/model_training/step_02_train_model.py
      - data/raw_data/dataset.csv
    # Track changes to these YAML training parameters as stage dependencies.
    params:
      - train.learning_rate
      - train.model_name
      - train.model_output_dir
      - train.batch_size
      - train.epochs
      - train.save_steps
    outs:
      - models/fraud_model_final

  # Step 03 evaluates the saved model using the prepared dataset.
  evaluation:
    cmd: python -m src.model_training.step_03_evaluate_model
    deps:
      - src/model_training/pipeline_helpers.py
      - src/model_training/step_03_evaluate_model.py
      - models/fraud_model_final
      - data/raw_data/dataset.csv
    # Declare metrics.json as a comparable metrics output; cache:false keeps it out of the DVC cache.
    metrics:
      - metrics.json:
          cache: false
